# Nginx Reverse Proxy Configuration for NexusBot
# Place in: /etc/nginx/sites-available/nexusbot
# Enable with: ln -s /etc/nginx/sites-available/nexusbot /etc/nginx/sites-enabled/
# Then run: certbot --nginx -d yourbotdomain.com

server {
    listen 80;
    server_name yourbotdomain.com; # Replace with your VPS domain or subdomain

    client_max_body_size 2048M; # Allow large APK file uploads

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for large uploads and broadcast streaming
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
